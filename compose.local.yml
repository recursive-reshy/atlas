# Local use on the Mac (ADR 0077): builds both images from this checkout, reads .env and mounts the
# vaults folder. Layered over docker-compose.yml through COMPOSE_FILE in .env.
services:
  app:
    build: .
    image: atlas-app:local
    env_file:
      - path: .env
        required: false
    volumes:
      - ${VAULTS_HOST_PATH:?Set VAULTS_HOST_PATH in .env to the folder that holds the vaults}:/vaults

  agent:
    build: apps/agent
    image: atlas-agent:local
    # The app reads the key from .env above; the agent is given it by name (ADR 0110)
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
    volumes:
      - ${VAULTS_HOST_PATH:?Set VAULTS_HOST_PATH in .env to the folder that holds the vaults}:/vaults:ro
