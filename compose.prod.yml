# Production on the VM (ADR 0077): pulls the images that deploy/release.sh pushed, restores the
# database from the bucket when there is none, replicates it, and syncs each user's vault.
# Layered over docker-compose.yml by the atlas systemd unit, with /etc/atlas/atlas.env and the
# fetched secrets as --env-file (deploy/vm/atlas.service).
services:
  restore:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    user: "1000:1000"
    command: [ "restore", "-if-db-not-exists", "-if-replica-exists", "/data/atlas.db" ]
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:?Set LITESTREAM_BUCKET in /etc/atlas/atlas.env}
    volumes:
      - data:/data
      - /opt/atlas/litestream.yml:/etc/litestream.yml:ro
    restart: "no"

  app:
    image: ${REGISTRY:?Set REGISTRY in /etc/atlas/atlas.env}/app:${ATLAS_VERSION:?Set ATLAS_VERSION in /etc/atlas/atlas.env}
    environment:
      LITESTREAM_METRICS_URL: http://litestream:9090/metrics
      VAULT_SYNC_STATUS_DIR: /sync-status
      # Claude federation (ADR 0110): no key on the VM. Never pass the key on here, not even blank:
      # an empty key makes the SDK take the key path instead of federating.
      ANTHROPIC_FEDERATION_RULE_ID: ${ANTHROPIC_FEDERATION_RULE_ID:?Set ANTHROPIC_FEDERATION_RULE_ID in /etc/atlas/atlas.env}
      ANTHROPIC_ORGANIZATION_ID: ${ANTHROPIC_ORGANIZATION_ID:?Set ANTHROPIC_ORGANIZATION_ID in /etc/atlas/atlas.env}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${ANTHROPIC_SERVICE_ACCOUNT_ID:?Set ANTHROPIC_SERVICE_ACCOUNT_ID in /etc/atlas/atlas.env}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:?Set ANTHROPIC_WORKSPACE_ID in /etc/atlas/atlas.env}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /run/anthropic/token
    volumes:
      - ${VAULTS_HOST_PATH:?Set VAULTS_HOST_PATH in /etc/atlas/atlas.env}:/vaults
      - sync-status:/sync-status:ro
      # The folder, not the file: the helper replaces the token by rename (deploy/vm/fetch-identity-token.sh)
      - /run/atlas/identity:/run/anthropic:ro
    depends_on:
      restore:
        condition: service_completed_successfully

  agent:
    image: ${REGISTRY}/agent:${ATLAS_VERSION}
    environment:
      ANTHROPIC_FEDERATION_RULE_ID: ${ANTHROPIC_FEDERATION_RULE_ID}
      ANTHROPIC_ORGANIZATION_ID: ${ANTHROPIC_ORGANIZATION_ID}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${ANTHROPIC_SERVICE_ACCOUNT_ID}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /run/anthropic/token
    volumes:
      - ${VAULTS_HOST_PATH}:/vaults:ro
      - /run/atlas/identity:/run/anthropic:ro

  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    user: "1000:1000"
    command: [ "replicate" ]
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
    volumes:
      - data:/data
      - /opt/atlas/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # One block per synced user. To add one: copy it, rename the service, the VAULT_DIR value, the
  # vault path and the config volume (and declare that volume below), then do the one-time
  # `ob login` / `ob sync-setup` from docs/deploy.md.
  sync-naresh:
    image: ${REGISTRY}/sync:${ATLAS_VERSION}
    environment:
      VAULT_DIR: naresh
    volumes:
      - ${VAULTS_HOST_PATH}/naresh:/vault
      - sync-status:/status
      - sync-naresh-config:/home/node/.config/obsidian-headless
    restart: unless-stopped

# The database and status folders live on the host, created by deploy/vm/bootstrap.sh and owned by
# UID 1000: a fresh named volume is root-owned when the Litestream or sync image mounts it first,
# and those containers do not run as root.
volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/atlas/data
  sync-status:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/atlas/sync-status
  sync-naresh-config:
