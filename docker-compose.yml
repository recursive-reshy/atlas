name: atlas

services:
  app:
    ports:
      - "127.0.0.1:3100:3100"
    # Production has no env_file, so every variable the server reads is named here. An unset
    # optional one reaches the server as an empty string, which config.ts treats as unset; the
    # server itself refuses to start without the rest.
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      AGENT_SECRET: ${AGENT_SECRET:?Set AGENT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_ORIGINS: ${APP_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      VAULT_CREATE_ENABLED: ${VAULT_CREATE_ENABLED:-true}
      DEFAULT_NOTE_FOLDER: ${DEFAULT_NOTE_FOLDER:-}
      AGENT_URL: http://agent:8100
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-}
      AGENT_SYLLABUS_TIMEOUT_MS: ${AGENT_SYLLABUS_TIMEOUT_MS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STATUS_CHECK_INTERVAL_MINUTES: ${STATUS_CHECK_INTERVAL_MINUTES:-2}
      SESSION_DAYS: ${SESSION_DAYS:-}
      CALENDAR_REDIRECT_URI: ${CALENDAR_REDIRECT_URI:-}
      CALENDAR_LOOKBACK_DAYS: ${CALENDAR_LOOKBACK_DAYS:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-}
      MELETE_DAY_START_HOUR: ${MELETE_DAY_START_HOUR:-}
      MELETE_REQUEST_RETENTION: ${MELETE_REQUEST_RETENTION:-}
      MELETE_GRADING_TIMEOUT_MS: ${MELETE_GRADING_TIMEOUT_MS:-}
      MELETE_GENERATION_TIMEOUT_MS: ${MELETE_GENERATION_TIMEOUT_MS:-}
    volumes:
      - data:/data
    restart: unless-stopped
    stop_grace_period: 75s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3100/api/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  agent:
    # The Claude credential is not here (ADR 0110): compose.local.yml gives the agent a key, and
    # compose.prod.yml gives both services federation. The app reads its key from .env locally.
    environment:
      AGENT_SECRET: ${AGENT_SECRET:?Set AGENT_SECRET in .env}
      VAULTS_ROOT: /vaults
      LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  data:
