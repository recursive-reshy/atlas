# Layered over docker-compose.yml by e2e/run.sh under the project name atlas-e2e.
# The vaults folder and the secrets come from run.sh; nothing here touches the real instance.
services:
  fakes:
    build: e2e/fakes
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    # Own image names, so a run never retags the images of the real instance.
    image: atlas-e2e:local
    # The base file reads the real .env; here every value is set below.
    env_file: !override []
    ports: !override
      - "3101:3100"
    environment:
      ANTHROPIC_BASE_URL: http://fakes:4000
      ANTHROPIC_API_KEY: e2e
      AGENT_SECRET: ${AGENT_SECRET:?run e2e/run.sh}
      # Gemini and the YouTube Data API are the fakes too
      GEMINI_MODEL: gemini-e2e
      GEMINI_API_KEY: e2e
      YOUTUBE_API_KEY: e2e
      GEMINI_BASE_URL: http://fakes:4000
      YOUTUBE_API_BASE_URL: http://fakes:4000
      ADMIN_EMAIL: admin@e2e.test
      # Mounts POST /api/test/session, which the server only allows under NODE_ENV=test (TRD §11.4)
      NODE_ENV: test
      E2E_TEST_SIGNIN: "1"
      # The fakes sit on the Compose network, which the address guard refuses (ADR 0096)
      FETCH_ALLOW_PRIVATE: "1"
      APP_ORIGINS: http://localhost:3101
      GOOGLE_CLIENT_ID: e2e
      GOOGLE_CLIENT_SECRET: e2e
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?run e2e/run.sh}
      # Calendar: the fakes answer the Calendar API and the token refresh (the consent screen is
      # not in e2e; home-calendar.spec.ts seeds a connected account instead)
      CALENDAR_REDIRECT_URI: http://localhost:3101/api/calendar/oauth/callback
      CALENDAR_API_BASE_URL: http://fakes:4000
    depends_on:
      fakes:
        condition: service_healthy
      # The server checks the agent once at start; without this the Status panel starts with the
      # agent failing for up to STATUS_CHECK_INTERVAL_MINUTES (the real stack does the same).
      agent:
        condition: service_healthy

  agent:
    image: atlas-agent-e2e:local
    environment:
      ANTHROPIC_BASE_URL: http://fakes:4000
      ANTHROPIC_API_KEY: e2e
    depends_on:
      fakes:
        condition: service_healthy
